<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端文件管理系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- 頁首 Header -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-cloud text-2xl"></i>
        <h1 class="text-2xl font-bold tracking-wide">雲端文件管理系統</h1>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openCategoryModal()" class="bg-indigo-500 hover:bg-indigo-400 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 border border-indigo-400 shadow-sm">
          <i class="fa-solid fa-sliders"></i> 分類管理員
        </button>
        <div class="hidden sm:block text-xs bg-emerald-600 px-3 py-1.5 rounded-full text-white font-medium">
          <i class="fa-solid fa-wifi mr-1"></i> Supabase 雲端同步中
        </div>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左側：新增文件表單 -->
    <section class="lg:col-span-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit sticky top-20">
      <h2 class="text-lg font-bold mb-4 flex items-center text-indigo-600 border-b pb-2">
        <i class="fa-solid fa-plus-circle mr-2"></i> 新增文件項目
      </h2>

      <form id="docForm" class="space-y-4">
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-sm font-semibold text-slate-700">分類 <span class="text-red-500">*</span></label>
            <button type="button" onclick="openCategoryModal()" class="text-xs text-indigo-600 hover:underline">
              <i class="fa-solid fa-gear"></i> 管理分類
            </button>
          </div>
          <select id="docCategorySelect" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <!-- 動態載入分類選項 -->
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">文件標題 <span class="text-red-500">*</span></label>
          <input type="text" id="docTitle" required placeholder="例如：2026年第二季部門會議紀錄" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">內容說明</label>
          <textarea id="docContent" rows="4" placeholder="請輸入文件摘要、重點備註或內容說明..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">照片 / 圖片</label>
          <input type="file" id="docPhoto" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
          <div id="photoPreview" class="mt-2 hidden">
            <img id="previewImg" src="" alt="預覽" class="h-28 object-cover rounded-lg border border-slate-200">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">夾帶檔案 (PDF, Word, Excel等)</label>
          <input type="file" id="docFile" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> 上傳並儲存至雲端
        </button>
      </form>
    </section>

    <!-- 右側：快速查詢與資料清單 -->
    <section class="lg:col-span-8 space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-3 items-center justify-between">
        <div class="relative w-full md:w-2/3">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="快速查詢標題、內容、分類或夾帶檔名..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div class="w-full md:w-1/3">
          <select id="filterCategory" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="ALL">全部分類 (顯示全部)</option>
          </select>
        </div>
      </div>

      <div class="flex justify-between items-center px-1 text-xs text-slate-500">
        <span>共找到 <strong id="docCount" class="text-indigo-600 font-bold text-sm">0</strong> 筆資料</span>
        <span class="text-slate-400">即時雲端同步</span>
      </div>

      <div id="docList" class="space-y-4">
        <!-- 動態渲染處 -->
      </div>
    </section>

  </main>

  <!-- 分類管理員 Modal -->
  <div id="categoryModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-lg mx-4 p-6 space-y-5">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-tags text-indigo-600"></i> 分類管理員
        </h3>
        <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-600 text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="addCategoryForm" class="flex gap-2">
        <input type="text" id="newCategoryInput" placeholder="請輸入新分類名稱..." required class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-1 shrink-0">
          <i class="fa-solid fa-plus"></i> 新增分類
        </button>
      </form>

      <div>
        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">現有分類列表</h4>
        <div id="categoryManagementList" class="max-h-64 overflow-y-auto space-y-2 pr-1"></div>
      </div>

      <div class="border-t pt-3 flex justify-end">
        <button onclick="closeCategoryModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 🔑 1. 填入您的 Supabase 設定資訊
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET_NAME = 'doc-files';

    // --- DOM 元素 ---
    const docForm = document.getElementById('docForm');
    const docCategorySelect = document.getElementById('docCategorySelect');
    const docPhotoInput = document.getElementById('docPhoto');
    const photoPreview = document.getElementById('photoPreview');
    const previewImg = document.getElementById('previewImg');
    const searchInput = document.getElementById('searchInput');
    const filterCategory = document.getElementById('filterCategory');
    const docList = document.getElementById('docList');
    const docCount = document.getElementById('docCount');
    const submitBtn = document.getElementById('submitBtn');
    
    const categoryModal = document.getElementById('categoryModal');
    const addCategoryForm = document.getElementById('addCategoryForm');
    const newCategoryInput = document.getElementById('newCategoryInput');
    const categoryManagementList = document.getElementById('categoryManagementList');

    let allDocs = [];
    let allCategories = [];

    // --- 初始化 ---
    async function initApp() {
      await loadCategories();
      await loadAndRenderDocs();
    }

    // --- Supabase 檔案上傳工具 ---
    async function uploadToStorage(file, folderName) {
      if (!file) return null;
      const fileExt = file.name.split('.').pop();
      const fileName = `${folderName}/${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;

      const { data, error } = await db.storage.from(BUCKET_NAME).upload(fileName, file);
      if (error) {
        alert('檔案上傳失敗：' + error.message);
        return null;
      }

      const { data: publicUrlData } = db.storage.from(BUCKET_NAME).getPublicUrl(fileName);
      return publicUrlData.publicUrl;
    }

    // --- 分類管理邏輯 ---
    function openCategoryModal() { categoryModal.classList.remove('hidden'); }
    function closeCategoryModal() { categoryModal.classList.add('hidden'); }

    async function loadCategories() {
      const { data, error } = await db.from('categories').select('*').order('created_at', { ascending: true });
      if (error) { console.error('載入分類失敗', error); return; }
      allCategories = data || [];
      renderCategoryOptions();
      renderCategoryManagementList();
    }

    function renderCategoryOptions() {
      const curSelect = docCategorySelect.value;
      const curFilter = filterCategory.value;

      docCategorySelect.innerHTML = allCategories.map(cat => 
        `<option value="${escapeHtml(cat.name)}">${escapeHtml(cat.name)}</option>`
      ).join('');

      if (curSelect && allCategories.some(c => c.name === curSelect)) docCategorySelect.value = curSelect;

      filterCategory.innerHTML = '<option value="ALL">全部分類 (顯示全部)</option>' +
        allCategories.map(cat => `<option value="${escapeHtml(cat.name)}">${escapeHtml(cat.name)}</option>`).join('');

      if (curFilter) filterCategory.value = curFilter;
    }

    function renderCategoryManagementList() {
      if (allCategories.length === 0) {
        categoryManagementList.innerHTML = `<div class="text-sm text-slate-400 py-2">目前無任何分類。</div>`;
        return;
      }

      categoryManagementList.innerHTML = allCategories.map(cat => `
        <div class="flex items-center justify-between bg-slate-50 border border-slate-200 p-2.5 rounded-lg">
          <span class="font-medium text-slate-700 text-sm">${escapeHtml(cat.name)}</span>
          <div class="flex items-center gap-1">
            <button onclick="editCategory(${cat.id}, '${escapeHtml(cat.name)}')" class="text-slate-500 hover:text-indigo-600 p-1 text-xs rounded hover:bg-slate-200">
              <i class="fa-solid fa-pen"></i> 修改
            </button>
            <button onclick="deleteCategory(${cat.id}, '${escapeHtml(cat.name)}')" class="text-slate-500 hover:text-red-600 p-1 text-xs rounded hover:bg-slate-200">
              <i class="fa-solid fa-trash-can"></i> 刪除
            </button>
          </div>
        </div>
      `).join('');
    }

    addCategoryForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = newCategoryInput.value.trim();
      if (!name) return;

      const { error } = await db.from('categories').insert([{ name }]);
      if (error) { alert('新增分類失敗，名稱可能重複！'); return; }

      newCategoryInput.value = '';
      await loadCategories();
    });

    window.editCategory = async function(id, oldName) {
      const newName = prompt(`請輸入「${oldName}」的新分類名稱：`, oldName);
      if (!newName || newName.trim() === '' || newName === oldName) return;

      const trimmedName = newName.trim();
      const { error } = await db.from('categories').update({ name: trimmedName }).eq('id', id);
      if (error) { alert('更新失敗！'); return; }

      // 同步更新文件資料表
      await db.from('documents').update({ category: trimmedName }).eq('category', oldName);
      await loadCategories();
      await loadAndRenderDocs();
    };

    window.deleteCategory = async function(id, name) {
      if (confirm(`確定要刪除分類「${name}」嗎？`)) {
        await db.from('categories').delete().eq('id', id);
        await loadCategories();
      }
    };

    // --- 文件新增與清單呈現 ---
    docPhotoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        previewImg.src = URL.createObjectURL(file);
        photoPreview.classList.remove('hidden');
      } else {
        photoPreview.classList.add('hidden');
      }
    });

    docForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const category = docCategorySelect.value;
      const title = document.getElementById('docTitle').value.trim();
      const content = document.getElementById('docContent').value.trim();
      const photoFile = docPhotoInput.files[0];
      const attachmentFile = document.getElementById('docFile').files[0];

      // 按鈕狀態變更
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 上傳中，請稍候...`;

      try {
        const photoUrl = await uploadToStorage(photoFile, 'photos');
        const fileUrl = await uploadToStorage(attachmentFile, 'attachments');

        const newDoc = {
          category,
          title,
          content,
          photo_url: photoUrl,
          file_url: fileUrl,
          file_name: attachmentFile ? attachmentFile.name : null,
          file_size: attachmentFile ? attachmentFile.size : null
        };

        const { error } = await db.from('documents').insert([newDoc]);
        if (error) throw error;

        docForm.reset();
        photoPreview.classList.add('hidden');
        await loadAndRenderDocs();
      } catch (err) {
        alert('新增文件失敗：' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> 上傳並儲存至雲端`;
      }
    });

    async function loadAndRenderDocs() {
      const { data, error } = await db.from('documents').select('*').order('created_at', { ascending: false });
      if (error) { console.error('載入文件失敗', error); return; }
      allDocs = data || [];
      renderDocs();
    }

    function renderDocs() {
      const query = searchInput.value.toLowerCase().trim();
      const selectedCat = filterCategory.value;

      const filtered = allDocs.filter(doc => {
        const matchCat = selectedCat === 'ALL' || doc.category === selectedCat;
        const matchSearch = !query || 
          doc.title.toLowerCase().includes(query) || 
          (doc.content && doc.content.toLowerCase().includes(query)) || 
          doc.category.toLowerCase().includes(query) ||
          (doc.file_name && doc.file_name.toLowerCase().includes(query));
        return matchCat && matchSearch;
      });

      docCount.textContent = filtered.length;

      if (filtered.length === 0) {
        docList.innerHTML = `
          <div class="bg-white p-8 rounded-xl text-center border border-slate-200 text-slate-400">
            <i class="fa-solid fa-folder-open text-4xl mb-3 text-slate-300"></i>
            <p>目前無符合條件的文件。</p>
          </div>
        `;
        return;
      }

      docList.innerHTML = filtered.map(doc => {
        const dateStr = new Date(doc.created_at).toLocaleString('zh-TW', {
          year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        });

        const formattedContent = doc.content ? doc.content.replace(/\n/g, '<br>') : '<span class="text-slate-400 italic">無內文說明</span>';

        const photoHtml = doc.photo_url ? `
          <div class="mt-3">
            <img src="${doc.photo_url}" alt="${escapeHtml(doc.title)}" class="max-h-48 rounded-lg border border-slate-200 object-cover cursor-pointer hover:opacity-90" onclick="openDocInNewWindow(${doc.id})">
          </div>
        ` : '';

        const fileHtml = doc.file_url ? `
          <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-2 text-sm text-slate-600 truncate max-w-xs sm:max-w-md">
              <i class="fa-solid fa-paperclip text-indigo-500"></i>
              <span class="font-medium truncate">${escapeHtml(doc.file_name)}</span>
              <span class="text-xs text-slate-400">(${formatBytes(doc.file_size)})</span>
            </div>
            <a href="${doc.file_url}" target="_blank" download class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1 rounded text-xs font-semibold flex items-center gap-1">
              <i class="fa-solid fa-download"></i> 下載
            </a>
          </div>
        ` : '';

        return `
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow relative space-y-3">
            <div class="flex justify-between items-start gap-3">
              <div>
                <span class="inline-block bg-indigo-100 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-semibold mb-2">
                  ${escapeHtml(doc.category)}
                </span>
                <h3 class="text-lg font-bold text-slate-800">${escapeHtml(doc.title)}</h3>
              </div>
              <button onclick="deleteDoc(${doc.id})" title="刪除" class="text-slate-300 hover:text-red-500 p-1 text-sm">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>

            <p class="text-sm text-slate-600 leading-relaxed line-clamp-3">${formattedContent}</p>

            ${photoHtml}
            ${fileHtml}

            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
              <div class="flex items-center gap-1">
                <i class="fa-regular fa-clock"></i> ${dateStr}
              </div>
              <button onclick="openDocInNewWindow(${doc.id})" class="bg-slate-800 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-medium transition-colors flex items-center gap-1.5 text-xs">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> 在新視窗開啟文件
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 🌟 手機相容新視窗獨立閱讀頁
    window.openDocInNewWindow = function(id) {
      const doc = allDocs.find(d => d.id === id);
      if (!doc) return;

      const dateStr = new Date(doc.created_at).toLocaleString('zh-TW', {
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
      });

      const formattedContent = doc.content ? doc.content.replace(/\n/g, '<br>') : '<span class="text-slate-400 italic">無內文說明</span>';

      const photoHtml = doc.photo_url ? `
        <div class="space-y-2">
          <h3 class="text-sm font-bold text-slate-500 flex items-center gap-2">
            <i class="fa-solid fa-image text-indigo-500"></i> 照片 / 圖片
          </h3>
          <div class="bg-slate-100 p-2 rounded-xl border border-slate-200 flex justify-center">
            <img src="${doc.photo_url}" class="max-w-full rounded-lg h-auto max-h-[70vh] object-contain shadow-sm">
          </div>
        </div>
      ` : '';

      const fileHtml = doc.file_url ? `
        <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <div class="flex items-center gap-3 overflow-hidden">
            <i class="fa-solid fa-file-lines text-2xl text-indigo-600 shrink-0"></i>
            <div class="truncate">
              <div class="font-bold text-slate-800 truncate">${escapeHtml(doc.file_name)}</div>
              <div class="text-xs text-slate-500">${formatBytes(doc.file_size)}</div>
            </div>
          </div>
          <a href="${doc.file_url}" target="_blank" download class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg text-sm flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-download"></i> 下載夾帶檔案
          </a>
        </div>
      ` : '';

      const detailHtml = `
        <!DOCTYPE html>
        <html lang="zh-TW">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>${escapeHtml(doc.title)}</title>
          <script src="https://cdn.tailwindcss.com"><\/script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        </head>
        <body class="bg-slate-100 min-h-screen text-slate-800 p-3 sm:p-6">
          <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="bg-slate-800 text-white px-5 py-4 flex justify-between items-center gap-3">
              <span class="bg-indigo-500 text-white text-xs px-3 py-1 rounded-full font-bold">${escapeHtml(doc.category)}</span>
              <div class="flex items-center gap-2">
                <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg flex items-center gap-1"><i class="fa-solid fa-print"></i> 列印</button>
                <button onclick="window.close()" class="bg-red-500 hover:bg-red-600 text-xs px-3 py-1.5 rounded-lg flex items-center gap-1"><i class="fa-solid fa-xmark"></i> 關閉</button>
              </div>
            </div>

            <div class="p-5 sm:p-8 space-y-6">
              <div class="border-b border-slate-100 pb-4">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">${escapeHtml(doc.title)}</h1>
                <div class="text-xs sm:text-sm text-slate-400"><i class="fa-regular fa-clock"></i> 建立時間：${dateStr}</div>
              </div>

              <div class="space-y-2">
                <h3 class="text-sm font-bold text-slate-500"><i class="fa-solid fa-align-left text-indigo-500"></i> 文件內容</h3>
                <div class="text-base sm:text-lg text-slate-700 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100 whitespace-pre-line">${formattedContent}</div>
              </div>

              ${photoHtml}
              ${fileHtml}
            </div>
          </div>
        </body>
        </html>
      `;

      const blob = new Blob([detailHtml], { type: 'text/html;charset=utf-8' });
      const blobUrl = URL.createObjectURL(blob);
      window.open(blobUrl, '_blank');
    };

    window.deleteDoc = async function(id) {
      if (confirm('確定要刪除這筆文件資料嗎？')) {
        await db.from('documents').delete().eq('id', id);
        await loadAndRenderDocs();
      }
    };

    function escapeHtml(str) {
      if(!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    function formatBytes(bytes, decimals = 1) {
      if (!bytes || bytes === 0) return '0 Bytes';
      const k = 1024, dm = decimals < 0 ? 0 : decimals, sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    searchInput.addEventListener('input', renderDocs);
    filterCategory.addEventListener('change', renderDocs);

    initApp();
  </script>
</body>
</html>
